<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    EL LOGOTIPO DE CLOCC COMO ICONO DE APLICACIÓN.

    Antes había aquí una casita con una palomita: era de cuando lo único
    instalable era «checar desde casa». Ahora se instalan dos pantallas —la de
    casa y la del cartel de la puerta— y una casa en la pantalla de inicio de
    quien ficha en la nave no significa nada.

    Los trazos son los MISMOS que dibuja `AstraLogo.vue`, sin el degradado: a
    tamaño de icono el degradado se pierde y sobre el verde de la marca el
    blanco plano se lee mejor.
  -->
  <rect width="512" height="512" fill="#059669"/>
  <g transform="translate(44.994 44.994) scale(0.8242)" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- El aro del reloj, abierto a las tres para dejar salir la palomita. -->
    <path d="M 235 118 A 140 140 0 1 0 394 280"/>
    <!-- Manecillas que además son una palomita, con el vértice en el centro. -->
    <path d="M 256 116 L 256 256 L 355 355"/>
  </g>
</svg>
