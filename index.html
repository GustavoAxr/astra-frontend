<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <!--
      El logotipo de Astra como icono de pestaña. Dos formatos y el orden
      importa: los navegadores actuales se quedan con el SVG —nítido a
      cualquier tamaño y en cualquier pantalla— y los que no lo entienden
      caen al .ico, que lleva dentro 16, 32 y 48 píxeles.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <!--
      iOS NO lee los iconos del manifiesto: para el icono de la pantalla de
      inicio mira esta etiqueta, y solo acepta PNG. Sin ella, quien instale la
      pantalla de checar desde un iPhone acaba con una captura borrosa de la
      página como icono.
    -->
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
    <meta name="theme-color" content="#059669">
    <!--
      iOS abre en su propia ventana lo que se añade a la pantalla de inicio solo
      si lo lee aquí. Con el manifiesto ya bastaría, pero el cartel de la puerta
      se instala SIN manifiesto —ver el script de abajo— y sin esta etiqueta se
      abriría dentro de Safari, con su barra de direcciones ocupando media
      pantalla de alguien que solo viene a fichar.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!--
      EL NOMBRE QUE QUEDA DEBAJO DEL ICONO. Sin esto, iPhone propone el `<title>`
      de la página —«Clocc - Codegahp»— y lo corta por donde le cabe. Es lo
      único que ve esa persona en su pantalla de inicio: tiene que decir la
      marca, no lo que hace la pantalla.
    -->
    <meta name="apple-mobile-web-app-title" content="Clocc">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
      /*
       * QUÉ APLICACIÓN SE ESTÁ INSTALANDO, DECIDIDO AQUÍ Y NO EN EL HTML.
       *
       * ══ POR QUÉ NO HAY UNA ETIQUETA FIJA ══
       *
       * Un sitio tiene UN manifiesto, y aquí conviven dos pantallas instalables
       * —checar desde casa y el cartel de la puerta— más un caso en el que lo
       * correcto es no tener ninguno. La etiqueta que inyectaba el plugin se
       * quita al construir (ver `vite.config.ts`) y aquí se pone la que toca.
       *
       * ══ EL CARTEL EN IPHONE NO LLEVA MANIFIESTO, Y ES DELIBERADO ══
       *
       * Una aplicación instalada en iPhone tiene su PROPIO almacenamiento,
       * separado del de Safari: un `start_url` fijo como `/checar` llega ahí sin
       * recordar en qué puerta checa esa persona, y se queda sin saber a dónde
       * ir. Sin manifiesto, Safari guarda LA DIRECCIÓN QUE ESTÁ ABIERTA —que ya
       * lleva dentro la empresa y la base— y el icono abre exactamente esa
       * puerta. Las etiquetas `apple-mobile-web-app-*` de arriba son las que
       * hacen que aun así se abra en su propia ventana y con el nombre correcto.
       *
       * En Android y en escritorio el almacenamiento es el mismo que el del
       * navegador, así que ahí sí se pone el del cartel y se gana una
       * instalación de verdad.
       */
      ;(function () {
        try {
          var ua = navigator.userAgent
          var esApple =
            /iPhone|iPad|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
          var enLaPuerta = location.pathname.indexOf('/checar') === 0

          if (enLaPuerta && esApple) return

          var enlace = document.createElement('link')
          enlace.rel = 'manifest'
          enlace.href = enLaPuerta
            ? '/manifest-checar.webmanifest'
            : '/manifest.webmanifest'
          document.head.appendChild(enlace)
        } catch (e) {
          /* Sin manifiesto no se puede instalar, pero la pantalla funciona
             igual. No es motivo para no pintar nada. */
        }
      })()
    </script>
    <!--
      El editor de geocercas pide sus imágenes a Mapbox. Resolver el nombre y
      dar la mano de TLS cuesta un tercio de segundo que hoy se paga cuando el
      mapa ya está en pantalla esperando; así se paga antes, en el hueco en que
      no hay nada que hacer.
    -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Lo que se lee en la pestaña y en el marcador. Era «astra-frontend», el
      nombre de la CARPETA del repositorio: se quedó del andamio de Vite y
      nadie lo tocó. Nadie fuera de aquí sabe qué es un «frontend», y menos el
      cliente que tiene la pestaña abierta todo el día.
    -->
    <title>Clocc - Codegahp</title>
    <script>
      /*
       * Se ejecuta antes de que el navegador pinte nada. Si esperáramos a que
       * arranque Vue, quien tiene el tema oscuro vería un fogonazo blanco en
       * cada carga.
       *
       * Lee la MISMA clave que VueUse (`vueuse-color-scheme`) y aplica la misma
       * clase, así que cuando el plugin de Nuxt UI arranca no cambia nada. Si
       * algo falla —almacenamiento bloqueado, modo privado— no pasa nada: la
       * aplicación sigue y se queda en claro.
       */
      try {
        var preferencia = localStorage.getItem('vueuse-color-scheme') || 'auto'
        var oscuro =
          preferencia === 'dark' ||
          (preferencia === 'auto' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', oscuro)
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
      } catch (e) {
        /* sin almacenamiento se entra en claro, que es el valor de partida */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
