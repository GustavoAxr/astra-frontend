<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <!--
      El logotipo de Astra como icono de pestaña. Dos formatos y el orden
      importa: los navegadores actuales se quedan con el SVG —nítido a
      cualquier tamaño y en cualquier pantalla— y los que no lo entienden
      caen al .ico, que lleva dentro 16, 32 y 48 píxeles.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <!--
      iOS NO lee los iconos del manifiesto: para el icono de la pantalla de
      inicio mira esta etiqueta, y solo acepta PNG. Sin ella, quien instale la
      pantalla de checar desde un iPhone acaba con una captura borrosa de la
      página como icono.
    -->
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
    <meta name="theme-color" content="#059669">
    <!--
      iOS abre en su propia ventana lo que se añade a la pantalla de inicio solo
      si lo lee aquí. Con el manifiesto ya bastaría, pero el cartel de la puerta
      se instala SIN manifiesto —ver el script de abajo— y sin esta etiqueta se
      abriría dentro de Safari, con su barra de direcciones ocupando media
      pantalla de alguien que solo viene a fichar.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
      /*
       * QUÉ APLICACIÓN SE INSTALA DESDE EL CARTEL DE LA PUERTA.
       *
       * ══ EL PROBLEMA, QUE TIENE DOS MITADES ══
       *
       * Un sitio tiene UN manifiesto, y el de Clocc apunta a `/remoto` —checar
       * desde casa—. Quien añadía a su pantalla de inicio el cartel de su puerta
       * acababa con un icono que abría la pantalla de a distancia y le decía
       * «este equipo no está dado de alta en ninguna empresa».
       *
       * La respuesta evidente —darle al cartel su propio manifiesto, con
       * `start_url: /checar`— funciona en Android y NO funciona en iPhone: ahí
       * la aplicación instalada tiene su PROPIO almacenamiento, separado del de
       * Safari, así que al abrirse no recuerda en qué puerta checa esa persona y
       * vuelve a quedarse sin saber a dónde ir.
       *
       * ══ LA SOLUCIÓN, DISTINTA EN CADA SISTEMA ══
       *
       * En iPhone se le quita el manifiesto a esta pantalla. Sin manifiesto,
       * Safari guarda LA DIRECCIÓN QUE ESTÁ ABIERTA —que ya lleva dentro la
       * empresa y la base— y el icono abre exactamente esa puerta, sin depender
       * de recordar nada.
       *
       * En Android y en escritorio se le pone el suyo: allí el almacenamiento es
       * el mismo que el del navegador, así que `/checar` sí encuentra la base
       * recordada, y a cambio se gana una instalación de verdad.
       *
       * Se hace en `DOMContentLoaded` y no aquí mismo porque el plugin inyecta su
       * etiqueta AL FINAL de la cabecera: cuando este script corre, todavía no
       * existe la que hay que quitar.
       */
      document.addEventListener('DOMContentLoaded', function () {
        try {
          if (location.pathname.indexOf('/checar') !== 0) return

          var ua = navigator.userAgent
          var esApple =
            /iPhone|iPad|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)

          var etiquetas = document.querySelectorAll('link[rel="manifest"]')
          if (esApple) {
            for (var i = 0; i < etiquetas.length; i++) etiquetas[i].remove()
            return
          }
          for (var j = 0; j < etiquetas.length; j++) {
            etiquetas[j].href = '/manifest-checar.webmanifest'
          }
        } catch (e) {
          /* Sin esto el icono llevará a la otra pantalla, que explica qué hacer.
             No es motivo para no pintar la página. */
        }
      })
    </script>
    <!--
      El editor de geocercas pide sus imágenes a Mapbox. Resolver el nombre y
      dar la mano de TLS cuesta un tercio de segundo que hoy se paga cuando el
      mapa ya está en pantalla esperando; así se paga antes, en el hueco en que
      no hay nada que hacer.
    -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Lo que se lee en la pestaña y en el marcador. Era «astra-frontend», el
      nombre de la CARPETA del repositorio: se quedó del andamio de Vite y
      nadie lo tocó. Nadie fuera de aquí sabe qué es un «frontend», y menos el
      cliente que tiene la pestaña abierta todo el día.
    -->
    <title>Clocc - Codegahp</title>
    <script>
      /*
       * Se ejecuta antes de que el navegador pinte nada. Si esperáramos a que
       * arranque Vue, quien tiene el tema oscuro vería un fogonazo blanco en
       * cada carga.
       *
       * Lee la MISMA clave que VueUse (`vueuse-color-scheme`) y aplica la misma
       * clase, así que cuando el plugin de Nuxt UI arranca no cambia nada. Si
       * algo falla —almacenamiento bloqueado, modo privado— no pasa nada: la
       * aplicación sigue y se queda en claro.
       */
      try {
        var preferencia = localStorage.getItem('vueuse-color-scheme') || 'auto'
        var oscuro =
          preferencia === 'dark' ||
          (preferencia === 'auto' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', oscuro)
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
      } catch (e) {
        /* sin almacenamiento se entra en claro, que es el valor de partida */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
